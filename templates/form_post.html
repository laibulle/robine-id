<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Continue · {{ product_name }}</title>
    {% if let Some(favicon) = favicon %}<link rel="icon" href="{{ favicon }}">{% endif %}
    <link rel="stylesheet" href="/assets/app.css">
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <main class="auth-shell" style="--auth-primary: {{ primary_color }}{% if let Some(font_family) = font_family %}; --auth-font: {{ font_family }}{% endif %}">
      <section class="auth-card" aria-labelledby="form-post-title">
        {% if let Some(logo) = logo %}<img src="{{ logo }}" alt="" class="configured-logo">{% else %}<img src="/images/brand/robine-mark.png" alt="" class="auth-brand-logo">{% endif %}
        <p class="eyebrow">{{ product_name }}</p>
        <h1 id="form-post-title">Continue to your application</h1>
        <p class="auth-intro" aria-live="polite">Your authorization response is ready. You will be redirected automatically.</p>
        <form id="authorization-response-form" method="post" action="{{ redirect_uri }}" class="auth-form" data-auto-submit>
          {% for parameter in parameters %}<input type="hidden" name="{{ parameter.0 }}" value="{{ parameter.1 }}">{% endfor %}
          <button id="authorization-response-submit" type="submit" class="primary-action">Continue securely</button>
        </form>
      </section>
    </main>
  </body>
</html>
