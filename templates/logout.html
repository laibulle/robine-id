<!doctype html>
<html lang="{{ messages.locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ messages.logout_title }} · {{ product_name }}</title>
    {% if let Some(favicon) = favicon %}<link rel="icon" href="{{ favicon }}">{% endif %}
    <link rel="stylesheet" href="/assets/app.css">
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <main class="auth-shell" style="--auth-primary: {{ primary_color }}{% if let Some(font_family) = font_family %}; --auth-font: {{ font_family }}{% endif %}">
      <section class="auth-card" aria-labelledby="logout-title">
        {% if let Some(logo) = logo %}<img src="{{ logo }}" alt="" class="configured-logo">{% else %}<img src="/images/brand/robine-mark.png" alt="" class="auth-brand-logo">{% endif %}
        <p class="eyebrow">{{ product_name }}</p>
        <h1 id="logout-title">{{ messages.logout_title }}</h1>
        <p class="auth-intro">{{ messages.logout_intro }}</p>
        <form id="logout-form" method="post" action="/{{ issuer_id }}/logout" class="consent-actions">
          <input type="hidden" name="transaction" value="{{ transaction }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button id="logout-confirm" type="submit" class="primary-action full-width">{{ messages.logout_submit }}</button>
        </form>
      </section>
    </main>
  </body>
</html>
