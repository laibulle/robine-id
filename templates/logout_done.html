<!doctype html>
<html lang="{{ messages.locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ messages.signed_out_title }} · {{ product_name }}</title>
    {% if let Some(favicon) = favicon %}<link rel="icon" href="{{ favicon }}">{% endif %}
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <main class="auth-shell" style="--auth-primary: {{ primary_color }}{% if let Some(font_family) = font_family %}; --auth-font: {{ font_family }}{% endif %}">
      <section class="auth-card" aria-labelledby="signed-out-title">
        {% if let Some(logo) = logo %}<img src="{{ logo }}" alt="" class="configured-logo">{% else %}<div class="success-mark" aria-hidden="true">✓</div>{% endif %}
        <p class="eyebrow">{{ product_name }}</p>
        <h1 id="signed-out-title">{{ messages.signed_out_title }}</h1>
        <p class="auth-intro">{{ messages.signed_out_intro }}</p>
        <a id="signed-out-home" class="primary-link full-width" href="/">{{ messages.return_home }}</a>
      </section>
    </main>
  </body>
</html>
