<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · {{ product_name }}</title>
    <link rel="stylesheet" href="/assets/app.css">
    <script defer src="/assets/app.js"></script>
  </head>
  <body>
    <main class="auth-shell" style="--auth-primary: {{ primary_color }}">
      <section class="auth-card" aria-labelledby="sign-in-title">
        <img src="/images/brand/robine-mark.png" alt="" class="auth-brand-logo">
        <p class="eyebrow">{{ product_name }}</p>
        <h1 id="sign-in-title">Welcome back</h1>
        <p class="auth-intro">Sign in to continue to <strong>{{ client_name }}</strong>.</p>

        <form id="login-form" method="post" action="/{{ issuer_id }}/authorize" class="auth-form">
          <input type="hidden" name="response_type" value="{{ request.response_type }}">
          <input type="hidden" name="client_id" value="{{ request.client_id }}">
          <input type="hidden" name="redirect_uri" value="{{ request.redirect_uri }}">
          <input type="hidden" name="scope" value="{{ request.scope }}">
          <input type="hidden" name="state" value="{{ request.state }}">
          <input type="hidden" name="nonce" value="{{ request.nonce }}">
          {% if let Some(code_challenge) = request.code_challenge %}<input type="hidden" name="code_challenge" value="{{ code_challenge }}">{% endif %}
          {% if let Some(code_challenge_method) = request.code_challenge_method %}<input type="hidden" name="code_challenge_method" value="{{ code_challenge_method }}">{% endif %}

          <label for="login_identifier">Email address</label>
          <input id="login_identifier" name="identifier" type="email" autocomplete="username" inputmode="email" required autofocus>
          <label for="login_password">Password</label>
          <div class="password-field">
            <input id="login_password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="reveal-password" data-password-toggle aria-label="Show password">Show</button>
          </div>
          <button id="login-submit" type="submit" class="primary-action">Continue</button>
        </form>
        <p class="privacy-note">Your password is never shared with {{ client_name }}.</p>
      </section>
    </main>
  </body>
</html>
