<!doctype html>
<html lang="{{ messages.locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ messages.error_title }} · {{ product_name }}</title>
    {% if let Some(favicon) = favicon %}<link rel="icon" href="{{ favicon }}">{% endif %}
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <main class="auth-shell" style="--auth-primary: {{ primary_color }}{% if let Some(font_family) = font_family %}; --auth-font: {{ font_family }}{% endif %}">
      <section class="auth-card" aria-labelledby="error-title">
        {% if let Some(logo) = logo %}<img src="{{ logo }}" alt="" class="configured-logo">{% else %}<div class="error-mark" aria-hidden="true">!</div>{% endif %}
        <p class="eyebrow">{{ product_name }}</p>
        <h1 id="error-title">{{ messages.error_title }}</h1>
        <div id="protocol-error" class="error-summary standalone-error" role="alert" tabindex="-1" data-error-summary>{{ message }}</div>
        <p id="error-reference" class="privacy-note">{{ messages.error_reference }}: <code>{{ request_id }}</code></p>
        <a id="error-home" class="primary-link error-action" href="/">{{ messages.return_home }}</a>
      </section>
    </main>
  </body>
</html>
