{{define "body"}}<main class="auth-shell">{{template "card" .}}</main>{{end}}
{{define "card"}}<section id="auth-card" class="auth-card" aria-labelledby="logout-title">{{template "brand-icon" .}}<p class="eyebrow">{{.ProductName}}</p><h1 id="logout-title">Sign out?</h1><p class="auth-intro">You will need to sign in again to continue.</p><form id="logout-form" class="auth-form" method="post" action="/{{.IssuerID}}/logout" hx-post="/{{.IssuerID}}/logout" hx-target="#auth-card" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><button class="primary-action" type="submit">Sign out</button></form></section>{{end}}
