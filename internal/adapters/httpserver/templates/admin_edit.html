{{define "body"}}<main class="portal-shell"><nav><a class="wordmark" href="/" aria-label="{{.ProductName}} home">{{template "wordmark" .}}</a><a href="/account">Account</a><a href="/admin">Users</a></nav>{{template "card" .}}</main>{{end}}
{{define "card"}}<section id="admin-user-editor" class="portal-card" aria-labelledby="manage-user-title"><a class="text-action" href="/admin/users">← Back to users</a><p class="eyebrow">Administrative override</p><h1 id="manage-user-title">Manage {{.User.Name}}</h1><p class="field-help">{{.User.Identifier}} · {{.User.ID}}</p>{{if .Error}}<div class="notice" role="alert" tabindex="-1">{{.Error}}</div>{{end}}<form id="admin-user-form" class="auth-form" method="post" action="/admin/users/{{.User.ID}}" hx-post="/admin/users/{{.User.ID}}" hx-target="#admin-user-editor" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><label for="admin-name">Display name</label><input id="admin-name" name="name" value="{{.User.Name}}" required><label for="admin-email">Email address</label><input id="admin-email" name="email" type="email" value="{{.User.Email}}" required><label for="admin-roles">Roles</label><input id="admin-roles" name="roles" value="{{.Roles}}" placeholder="admin, support"><label class="checkbox"><input name="enabled" type="checkbox" value="true" {{if .Enabled}}checked{{end}}> Account enabled</label><button id="admin-user-save" class="primary-action" type="submit">Save user</button></form></section>{{end}}
