services:
  robine-id:
    build:
      context: .
    image: robine-id:0.2.0
    restart: unless-stopped
    env_file:
      - path: .env.release
        required: false
    environment:
      PORT: "8080"
      ROBINE_ID_BLOB_STORE: local
      ROBINE_ID_STORAGE_ROOT: /config
      ROBINE_ID_CONFIG_KEY: robine_id.json
      ROBINE_ID_APPLICATIONS_PREFIX: applications
      ROBINE_ID_STATE_ROOT: /data
      ROBINE_ID_SIGNING_KEY: signing_keys.json.enc
      ROBINE_ID_ACCOUNTS_KEY: accounts.json
    ports:
      - "127.0.0.1:4001:8080"
    volumes:
      - ./deploy/config:/config:ro
      - robine_id_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 3s
      retries: 3

volumes:
  robine_id_data:
