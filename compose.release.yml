services:
  robine-id:
    build:
      context: .
    image: ${ROBINE_ID_IMAGE:-robine-id:0.1.0}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: ${ROBINE_ID_ENV_FILE:-.env.release}
        required: true
    environment:
      HOST: 0.0.0.0
      PORT: "4001"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: robine_id
      PGUSER: robine_id
      ROBINE_ID_CONFIG: /config/robine_id.json
      ROBINE_ID_APPLICATIONS_DIR: /config/applications
    ports:
      - "${ROBINE_ID_BIND_ADDRESS:-127.0.0.1}:${ROBINE_ID_BIND_PORT:-4001}:4001"
    volumes:
      - ${ROBINE_ID_CONFIG_PATH:-./deploy/config/robine_id.json}:/config/robine_id.json:ro
      - ${ROBINE_ID_APPLICATIONS_PATH:-./deploy/config/applications}:/config/applications:ro
    networks:
      application:
        gw_priority: 1
      database: {}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/robine-id-healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    stop_grace_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - path: ${ROBINE_ID_ENV_FILE:-.env.release}
        required: true
    environment:
      POSTGRES_DB: robine_id
      POSTGRES_USER: robine_id
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robine_id -d robine_id"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - robine_id_postgres:/var/lib/postgresql/data
    networks:
      - database

volumes:
  robine_id_postgres:

networks:
  application:
  database:
    internal: true
