services:
  robine-id:
    user: "${ROBINE_ID_SECRET_OWNER_UID:?set ROBINE_ID_SECRET_OWNER_UID to the secret file owner}:${ROBINE_ID_SECRET_OWNER_GID:?set ROBINE_ID_SECRET_OWNER_GID to the secret file group}"
    environment:
      PGPASSWORD_FILE: /run/secrets/robine_id_postgres_password
      KEY_ENCRYPTION_SECRET_FILE: /run/secrets/robine_id_key_encryption_secret
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/secrets/robine_id_oauth2_proxy_client_secret
    secrets:
      - robine_id_postgres_password
      - robine_id_key_encryption_secret
      - robine_id_oauth2_proxy_client_secret

  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/robine_id_postgres_password
    secrets:
      - robine_id_postgres_password

secrets:
  robine_id_postgres_password:
    file: ${ROBINE_ID_POSTGRES_PASSWORD_PATH:-./deploy/secrets/postgres_password}
  robine_id_key_encryption_secret:
    file: ${ROBINE_ID_KEY_ENCRYPTION_SECRET_PATH:-./deploy/secrets/key_encryption_secret}
  robine_id_oauth2_proxy_client_secret:
    file: ${ROBINE_ID_OAUTH2_PROXY_CLIENT_SECRET_PATH:-./deploy/secrets/oauth2_proxy_client_secret}
