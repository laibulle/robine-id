services:
  app:
    profiles: ["runtime"]
    build:
      context: .
    image: robine-id-rust:dev
    container_name: robine-id-rust-dev
    restart: unless-stopped
    init: true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgres://robine_id:robine_id_dev@postgres:5432/robine_id
      KEY_ENCRYPTION_SECRET: development-only-key-encryption-secret-change-me
      ROBINE_ID_RELOAD_INTERVAL: "1000"
    ports:
      - "127.0.0.1:4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/robine-id-healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ./config:/app/config:ro
    networks:
      application:
        gw_priority: 1
      database: {}

  postgres:
    image: postgres:17-alpine
    container_name: robine-id-postgres-dev
    restart: unless-stopped
    init: true
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,mode=3775,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: robine_id
      POSTGRES_USER: robine_id
      POSTGRES_PASSWORD: robine_id_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robine_id -d robine_id"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    networks:
      - database

volumes:
  postgres_dev:
    name: robine-id-postgres-dev

networks:
  application:
  database:
    internal: true
