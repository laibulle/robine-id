version: 1
name: Robine ID Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    image: docker:28-cli
    shell: /bin/sh
    timeout: 40m
    env:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    services:
      docker:
        image: docker:28-dind
        privileged: true
        env:
          DOCKER_TLS_CERTDIR: ""
        command: ["--tls=false"]
        readiness:
          tcp: 2375
          timeout: 60s
    steps:
      - name: Checkout tagged revision
        uses: checkout
      - name: Install release dependencies
        run: |
          apk add --no-cache curl make openssl
          docker version
          docker compose version
      - name: Exercise production topology
        run: make release-smoke
      - name: Build production image
        run: docker build --tag robine-id:release .
      - name: Prepare release payload
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save robine-id:release | gzip -9 > dist/robine-id-image.tar.gz
          sha256sum dist/robine-id-image.tar.gz > dist/robine-id-image.tar.gz.sha256
      - name: Upload GitHub release payload
        uses: artifacts/upload
        with:
          name: github-release-robine_id-${{ runner.os }}-${{ runner.arch }}
          paths: [dist]
          retention-days: 30
