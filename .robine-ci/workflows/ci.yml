version: 1
name: Robine ID CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  rust-verify:
    image: rust:1.88-bookworm
    shell: /bin/bash
    timeout: 25m
    env:
      DATABASE_URL: postgres://robine_id:robine_id_ci@postgres:5432/robine_id
      KEY_ENCRYPTION_SECRET: ci-key-encryption-secret-at-least-32-bytes
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: robine_id
          POSTGRES_USER: robine_id
          POSTGRES_PASSWORD: robine_id_ci
        readiness:
          tcp: 5432
          timeout: 60s
    steps:
      - name: Checkout
        uses: checkout
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy
      - name: Verify Rust runtime
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo test --test postgres -- --ignored --test-threads=1
          cargo build --locked --release --bin vercel

  verify:
    image: hexpm/elixir@sha256:ae38be7cb19bffa78adedb04732d9e6ba83a507b4cfb06983cbe711edb49da54
    shell: /bin/bash
    timeout: 20m
    env:
      MIX_ENV: test
      ERL_FLAGS: "+S 4:4"
      MAKEFLAGS: "-j4"
    steps:
      - name: Checkout
        uses: checkout
      - name: Install native test dependencies
        run: |
          mkdir -p /tmp/apt-archives/partial
          chmod 0777 /tmp/apt-archives /tmp/apt-archives/partial
          apt-get -o APT::Sandbox::User=root \
            -o Dir::Cache::archives=/tmp/apt-archives update
          DEBIAN_FRONTEND=noninteractive apt-get \
            -o APT::Sandbox::User=root \
            -o Dir::Cache::archives=/tmp/apt-archives \
            install --yes --no-install-recommends \
            build-essential ca-certificates git
          rm -rf /var/lib/apt/lists/*
      - name: Install Mix tooling
        run: |
          mix local.hex --force
          mix local.rebar --force
      - name: Restore Mix cache
        uses: cache/restore
        with:
          key: robine-id-mix-${{ checksum('mix.lock') }}
          paths: [deps]
      - name: Install dependencies
        run: mix deps.get
      - name: Run project verification
        run: mix precommit
      - name: Generate coverage report
        run: |
          set -euo pipefail
          set +e
          mix coverage | tee /tmp/robine-id-coverage.log
          coverage_status=${PIPESTATUS[0]}
          set -e

          coverage_total=$(awk '/\| Total[[:space:]]*\|$/{gsub(/%/, "", $2); print $2}' /tmp/robine-id-coverage.log | tail -1)
          if [[ -n "${coverage_total}" ]]; then
            printf 'ROBINE_COVERAGE total=%s threshold=70 report=coverage-report\n' "${coverage_total}"
          fi

          exit "${coverage_status}"
      - name: Upload coverage report
        if: always
        uses: artifacts/upload
        with:
          name: coverage-report
          paths: [cover]
          retention-days: 14
      - name: Save Mix cache
        uses: cache/save
        with:
          key: robine-id-mix-${{ checksum('mix.lock') }}
          paths: [deps]
