version: 1
name: Robine ID CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  rust-verify:
    image: rust:1.88-bookworm
    shell: /bin/bash
    timeout: 25m
    env:
      DATABASE_URL: postgres://robine_id:robine_id_ci@postgres:5432/robine_id
      KEY_ENCRYPTION_SECRET: ci-key-encryption-secret-at-least-32-bytes
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: robine_id
          POSTGRES_USER: robine_id
          POSTGRES_PASSWORD: robine_id_ci
        readiness:
          tcp: 5432
          timeout: 60s
    steps:
      - name: Checkout
        uses: checkout
      - name: Install Rust quality components
        run: rustup component add rustfmt clippy
      - name: Verify Rust runtime
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo test --test postgres -- --ignored --test-threads=1
          cargo build --locked --release --bin vercel

  release-smoke:
    image: docker:28-cli
    shell: /bin/sh
    timeout: 30m
    env:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
    services:
      docker:
        image: docker:28-dind
        privileged: true
        env:
          DOCKER_TLS_CERTDIR: ""
        command: ["--tls=false"]
        readiness:
          tcp: 2375
          timeout: 60s
    steps:
      - name: Checkout
        uses: checkout
      - name: Install smoke-test dependencies
        run: apk add --no-cache curl make openssl
      - name: Verify production topology and OIDC flow
        run: |
          docker version
          docker compose version
          make release-smoke
