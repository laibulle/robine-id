version: 1
name: Robine ID CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  verify:
    image: golang:1.27.1
    shell: /bin/bash
    timeout: 20m
    env:
      GOMAXPROCS: "4"
    steps:
      - name: Checkout
        uses: checkout
      - name: Restore Go cache
        uses: cache/restore
        with:
          key: robine-id-go-${{ checksum('go.sum') }}
          paths: [/go/pkg/mod, /root/.cache/go-build]
      - name: Download dependencies
        run: go mod download
      - name: Verify project
        run: make check
      - name: Upload coverage report
        if: always
        uses: artifacts/upload
        with:
          name: coverage-report
          paths: [coverage]
          retention-days: 14
      - name: Save Go cache
        uses: cache/save
        with:
          key: robine-id-go-${{ checksum('go.sum') }}
          paths: [/go/pkg/mod, /root/.cache/go-build]
